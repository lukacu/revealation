<!doctype html>
<!--
  Revealation preview/print shell
  --------------------------------
  This document intentionally contains only the reveal.js host DOM and security
  policy. All runtime behavior lives in src/rendering/preview.js so normal
  preview and PDF print mode share one implementation.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- Scoped CSP for the preview document. The preview iframe is intentionally
     not sandboxed because some reveal/PDF content requires normal browser
     behavior; only trusted presentation projects should be opened. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' http:; style-src 'self' 'unsafe-inline' http: https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https: http:; connect-src 'self' http:; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation</title>
<base href="../">
<link rel="stylesheet" id="reveal-css">
<link rel="stylesheet" id="theme-css">
<link rel="stylesheet" id="highlight-css">
<style>html, body { margin: 0; height: 100%; background: #000; }</style>
</head>
<body>
<div class="reveal"><div class="slides"></div></div>
<script src="__app__/src/background/runtime.js"></script>
<script src="__app__/src/core/revealation.js"></script>
<script src="__app__/src/platform/browser.js"></script>
<script src="__app__/src/platform/platform.js"></script>
<script src="__app__/src/rendering/preview.js"></script>
</body>
</html>
